name: Publish to the Comfy Registry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pyproject.toml"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'tanvoai'
    env:
      TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
    steps:
      - if: env.TOKEN == ''
        run: echo "::notice::REGISTRY_ACCESS_TOKEN is not set, so nothing was published. Add it under Settings → Secrets → Actions."
      - if: env.TOKEN != ''
        uses: actions/checkout@v4
      - if: env.TOKEN != ''
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ env.TOKEN }}
