name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest tests/test_core.py

  comfyui:
    # Every node in a real ComfyUI (CPU) against a local stand-in for the Tanvo API:
    # the oldest supported release and the newest.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        comfyui: ["v0.8.0", "master"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ComfyUI-Tanvo
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: ${{ matrix.comfyui }}
          path: ComfyUI
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r ComfyUI/requirements.txt -r ComfyUI-Tanvo/requirements.txt
      - run: ln -s "$GITHUB_WORKSPACE/ComfyUI-Tanvo" ComfyUI/custom_nodes/comfyui-tanvo
      - run: python -m unittest tests/test_e2e.py
        working-directory: ComfyUI-Tanvo
        env:
          COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
